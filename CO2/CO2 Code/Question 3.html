<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Layout - CSS Grid</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
}

.dashboard{
display:grid;
grid-template-columns:250px 1fr;
grid-template-rows:70px 1fr 60px;
grid-template-areas:
"header header"
"sidebar main"
"footer footer";
min-height:100vh;
}

.header{
grid-area:header;
background:#2c3e50;
color:white;
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
}

.sidebar{
grid-area:sidebar;
background:#34495e;
color:white;
padding:20px;
}

.sidebar ul{
list-style:none;
}

.sidebar li{
padding:15px 0;
border-bottom:1px solid rgba(255,255,255,0.2);
}

.main{
grid-area:main;
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:white;
padding:30px;
border-radius:8px;
box-shadow:0 4px 8px rgba(0,0,0,0.2);
text-align:center;
font-size:20px;
}

.footer{
grid-area:footer;
background:#2c3e50;
color:white;
display:flex;
justify-content:center;
align-items:center;
}

@media(max-width:768px){

.dashboard{

grid-template-columns:1fr;

grid-template-areas:

"header"

"sidebar"

"main"

"footer";

}

.main{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<div class="dashboard">

<div class="header">

Dashboard

</div>

<div class="sidebar">

<h2>Menu</h2>

<ul>

<li>Home</li>

<li>Analytics</li>

<li>Users</li>

<li>Settings</li>

<li>Reports</li>

</ul>

</div>

<div class="main">

<div class="card">Sales</div>

<div class="card">Revenue</div>

<div class="card">Orders</div>

<div class="card">Customers</div>

<div class="card">Products</div>

<div class="card">Feedback</div>

</div>

<div class="footer">

Dashboard Layout Using CSS Grid

</div>

</div>

</body>

</html>
