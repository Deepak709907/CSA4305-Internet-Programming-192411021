<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Hover Effect</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f2f2f2;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.product-card{
width:300px;
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
text-align:center;
transition:transform 0.4s ease, box-shadow 0.4s ease;
cursor:pointer;
}

.product-card:hover{
transform:translateY(-10px) scale(1.05);
box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

.product-card img{
width:100%;
height:220px;
object-fit:cover;
transition:transform 0.4s ease;
}

.product-card:hover img{
transform:scale(1.1);
}

.product-info{
padding:20px;
}

.product-info h2{
margin-bottom:10px;
color:#333;
}

.product-info p{
font-size:18px;
color:green;
margin-bottom:15px;
}

button{
padding:10px 20px;
border:none;
background:#007BFF;
color:white;
font-size:16px;
border-radius:5px;
cursor:pointer;
transition:background 0.3s;
}

button:hover{
background:#0056b3;
}

</style>

</head>

<body>

<div class="product-card">

<img src="https://via.placeholder.com/300x220.png?text=Product+Image" alt="Product">

<div class="product-info">

<h2>Wireless Headphones</h2>

<p>₹2,999</p>

<button>Add to Cart</button>

</div>

</div>

</body>

</html>
